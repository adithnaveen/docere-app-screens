<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Client - Docere App</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex justify-content-end mb-3">
                    <a href="../index.html" class="btn btn-outline-primary">Home</a>
                </div>
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title mb-4">Create New Client</h3>
                        <form id="clientForm">
                            <!-- Basic Client Information -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="clientName" class="form-label">Client Name</label>
                                    <input type="text" class="form-control" id="clientName" name="clientName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="location" class="form-label">Location</label>
                                    <input list="cityList" class="form-control" id="location" name="location" required autocomplete="off">
                                    <datalist id="cityList">
                                        <option value="Mumbai">
                                        <option value="Delhi">
                                        <option value="Bengaluru">
                                        <option value="Hyderabad">
                                        <option value="Ahmedabad">
                                        <option value="Chennai">
                                        <option value="Kolkata">
                                        <option value="Pune">
                                        <option value="Jaipur">
                                        <option value="Lucknow">
                                        <option value="Kanpur">
                                        <option value="Nagpur">
                                        <option value="Indore">
                                        <option value="Thane">
                                        <option value="Bhopal">
                                        <option value="Visakhapatnam">
                                        <option value="Patna">
                                        <option value="Vadodara">
                                        <option value="Ghaziabad">
                                        <option value="Ludhiana">
                                        <option value="Agra">
                                        <option value="Nashik">
                                        <option value="Faridabad">
                                        <option value="Meerut">
                                        <option value="Rajkot">
                                        <option value="Kalyan-Dombivli">
                                        <option value="Vasai-Virar">
                                        <option value="Varanasi">
                                        <option value="Srinagar">
                                        <option value="Aurangabad">
                                        <option value="Dhanbad">
                                        <option value="Amritsar">
                                        <option value="Navi Mumbai">
                                        <option value="Allahabad">
                                        <option value="Ranchi">
                                        <option value="Howrah">
                                        <option value="Coimbatore">
                                        <option value="Jabalpur">
                                        <option value="Gwalior">
                                        <option value="Vijayawada">
                                        <option value="Jodhpur">
                                        <option value="Madurai">
                                        <option value="Raipur">
                                        <option value="Kota">
                                        <option value="Guwahati">
                                        <option value="Chandigarh">
                                        <option value="Solapur">
                                        <option value="Hubli–Dharwad">
                                        <option value="Bareilly">
                                        <option value="Mysore">
                                    </datalist>
                                </div>
                            </div>

                            <!-- Tax Information -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="gst" class="form-label">GST Number</label>
                                    <input type="text" class="form-control" id="gst" name="gst" 
                                           pattern="^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$" 
                                           title="Please enter a valid GST number">
                                    <div class="form-text">Format: 22AAAAA0000A1Z5</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="pan" class="form-label">PAN Number</label>
                                    <input type="text" class="form-control" id="pan" name="pan" 
                                           pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" 
                                           title="Please enter a valid PAN number">
                                    <div class="form-text">Format: AAAAA0000A</div>
                                </div>
                            </div>

                            <!-- SPOC Information -->
                            <div class="mb-4">
                                <label class="form-label">SPOC Details</label>
                                <div id="spocList" class="mb-3">
                                    <div class="spoc-item card mb-3">
                                        <div class="card-body">
                                            <div class="row g-3">
                                                <div class="col-md-4">
                                                    <input type="text" class="form-control" name="spocName[]" placeholder="Name" required>
                                                </div>
                                                <div class="col-md-4">
                                                    <input type="email" class="form-control" name="spocEmail[]" placeholder="Email" required>
                                                </div>
                                                <div class="col-md-3">
                                                    <input type="tel" class="form-control" name="spocContact[]" placeholder="Contact" required>
                                                </div>
                                                <div class="col-md-1 d-flex align-items-center">
                                                    <button type="button" class="btn btn-danger btn-sm" onclick="removeSpoc(this)" style="display: none;">
                                                        <i class="bi bi-trash"></i> Remove
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-secondary" onclick="addSpoc()">
                                    <i class="bi bi-plus-circle"></i> Add Another SPOC
                                </button>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-light">Reset</button>
                                <button type="submit" class="btn btn-primary">Create Client</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        function addSpoc() {
            const spocList = document.getElementById('spocList');
            const spocItems = spocList.querySelectorAll('.spoc-item');
            
            // Show remove buttons if we're adding a new SPOC
            spocItems.forEach(item => {
                const removeBtn = item.querySelector('.btn-danger');
                if (removeBtn) removeBtn.style.display = 'block';
            });

            const template = `
                <div class="spoc-item card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" class="form-control" name="spocName[]" placeholder="Name" required>
                            </div>
                            <div class="col-md-4">
                                <input type="email" class="form-control" name="spocEmail[]" placeholder="Email" required>
                            </div>
                            <div class="col-md-3">
                                <input type="tel" class="form-control" name="spocContact[]" placeholder="Contact" required>
                            </div>
                            <div class="col-md-1 d-flex align-items-center">
                                <button type="button" class="btn btn-danger btn-sm" onclick="removeSpoc(this)">
                                    <i class="bi bi-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            spocList.insertAdjacentHTML('beforeend', template);
        }

        function removeSpoc(btn) {
            const spocItems = document.querySelectorAll('.spoc-item');
            if (spocItems.length > 1) {
                btn.closest('.spoc-item').remove();
                
                // If only one SPOC remains, hide its remove button
                if (spocItems.length === 2) {
                    const lastRemoveBtn = document.querySelector('.spoc-item .btn-danger');
                    if (lastRemoveBtn) lastRemoveBtn.style.display = 'none';
                }
            }
        }

        // Form submission handler
        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // TODO: Add form submission logic here
            console.log('Form submitted');
        });
    </script>
</body>
</html>
